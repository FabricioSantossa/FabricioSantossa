name: Atualizar aviao de contribuicoes

on:
  schedule:
    - cron: "37 6 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/generate-flight.py
      - .github/workflows/profile-flight.yml

permissions:
  contents: write

concurrency:
  group: profile-flight
  cancel-in-progress: false

jobs:
  generate:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
      - name: Gerar animacao com calendario publico
        run: python3 scripts/generate-flight.py
      - name: Publicar animacao
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/flight.svg
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: atualizar voo de contribuicoes"
          git pull --rebase origin main
          git push origin HEAD:main
