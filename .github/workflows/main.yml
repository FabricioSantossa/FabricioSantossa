name: Generate Pacman Animation

on:
  # Roda a cada 12 horas automaticamente
  schedule:
    - cron: "0 */12 * * *"
  
  # Permite que você rode manualmente pela aba "Actions" do repositório
  workflow_dispatch:
  
  # Roda também a cada novo push para a branch main
  push:
    branches:
      - main

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Gera a animação com base no seu gráfico de contribuições
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/pacman-contribution-graph.svg
            dist/pacman-contribution-graph-dark.svg?palette=github-dark&color_snake=yellow

      # Envia os arquivos gerados para uma branch chamada "output"
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}