name: Generate Snake Animation

on:
  # Roda a cada 12 horas automaticamente
  schedule:
    - cron: "0 */12 * * *"
  
  # Permite que você rode manualmente pela aba "Actions" do repositório
  workflow_dispatch:
  
  # Roda também a cada novo push para a branch main
  push:
    branches:
      - main

jobs:
  generate:
    permissions:
      contents: write
      
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      # Gera a animação da cobrinha
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Altera os nomes dos arquivos de saída para "snake"
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      # Envia os arquivos gerados para a branch "output"
      - uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}